<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biologie-Werkstatt</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap">
<style>/* Layout: Seitenleiste mit Klassen/Themen links, Arbeitsfläche rechts; Arbeitsblatt als "Papier" */
:root{
  --bg:#EEF3EC; --panel:#FFFFFF; --paper:#FFFFFF; --ink:#16241B; --muted:#58695D; --line:#CFDBCB;
  --leaf:#2D7A47; --leaf-ink:#FFFFFF; --leaf-soft:#D8EAD6;
  --pollen:#D99A0B; --pollen-soft:#FBEDC4;
  --berry:#B4336A; --berry-soft:#F5DAE5;
  --sky:#2B6C9C; --sky-soft:#D9E8F3;
  --bone:#F1E9D4; --bone-line:#8E7F5E; --soil:#EFE3CF; --root:#9C7A51; --liver:#C7876A; --gut:#E6A29B; --colon:#D8B784;
  --ok:#2D7A47; --ok-soft:#D8EAD6; --bad:#BF3B2B; --bad-soft:#F7DAD5;
  --f-display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0F1712; --panel:#16211A; --paper:#1A261F; --ink:#E4EDE3; --muted:#9AAE9F; --line:#2B3B30;
  --leaf:#6CC48A; --leaf-ink:#0F1712; --leaf-soft:#1E3526;
  --pollen:#F0C04F; --pollen-soft:#3A3016; --berry:#E97BAA; --berry-soft:#3B1E2B; --sky:#80B8DF; --sky-soft:#192D3B;
  --bone:#3C3628; --bone-line:#BFAE85; --soil:#2C251B; --root:#C4A273; --liver:#A2664D; --gut:#9A5E58; --colon:#8D7550;
  --ok:#6CC48A; --ok-soft:#1E3526; --bad:#F2806F; --bad-soft:#3E1F1A; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0F1712; --panel:#16211A; --paper:#1A261F; --ink:#E4EDE3; --muted:#9AAE9F; --line:#2B3B30;
  --leaf:#6CC48A; --leaf-ink:#0F1712; --leaf-soft:#1E3526;
  --pollen:#F0C04F; --pollen-soft:#3A3016; --berry:#E97BAA; --berry-soft:#3B1E2B; --sky:#80B8DF; --sky-soft:#192D3B;
  --bone:#3C3628; --bone-line:#BFAE85; --soil:#2C251B; --root:#C4A273; --liver:#A2664D; --gut:#9A5E58; --colon:#8D7550;
  --ok:#6CC48A; --ok-soft:#1E3526; --bad:#F2806F; --bad-soft:#3E1F1A; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;margin:0}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
a{color:var(--leaf)}
:focus-visible{outline:3px solid var(--pollen);outline-offset:2px}

.app{display:grid;grid-template-columns:290px 1fr;min-height:100%}
.side{background:var(--panel);border-right:1px solid var(--line);padding-block:20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:16px;position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px;cursor:pointer;background:none;border:0;padding:0;text-align:left}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:1.3rem;letter-spacing:-.01em;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.78rem}
.kl{margin-top:18px}
.kl-h{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-display);font-weight:700;font-size:.95rem;padding:6px 4px;border-bottom:2px solid var(--line);width:100%;background:none;border-top:0;border-left:0;border-right:0;cursor:pointer;text-align:left}
.kl-h span{font-family:var(--f-body);font-weight:400;font-size:.75rem;color:var(--muted)}
.kl ul{list-style:none;margin:6px 0 0;padding:0}
.kl li button{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:7px 8px;cursor:pointer;font-size:.9rem;line-height:1.3}
.kl li button:hover{background:var(--leaf-soft)}
.kl li button[aria-current="true"]{background:var(--leaf);color:var(--leaf-ink)}
.dot{width:9px;height:9px;border-radius:50%;flex:none;margin-top:5px;background:var(--leaf);border:2px solid var(--leaf)}
.dot.plan{background:transparent;border-color:var(--muted)}
.kl li button[aria-current="true"] .dot{background:var(--leaf-ink);border-color:var(--leaf-ink)}
.legend-s{font-size:.75rem;color:var(--muted);margin-top:18px;display:flex;gap:14px}
.legend-s span{display:flex;gap:6px;align-items:center}
.legend-s .dot{margin:0}

.main{min-width:0;padding-block:28px 60px;padding-left:max(16px, 3vw);padding-right:max(16px, env(safe-area-inset-right, 0px), 3vw)}
.mobilebar{display:none}
.eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.t-head h1{font-size:clamp(1.7rem,3.2vw,2.5rem);margin:4px 0 8px;letter-spacing:-.015em}
.lp{color:var(--muted);max-width:70ch;margin:0 0 10px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--sky-soft);color:var(--sky);font-weight:700}
.tabs{display:flex;gap:4px;margin:22px 0 0;border-bottom:2px solid var(--line);flex-wrap:wrap;align-items:flex-end}
.tab{border:0;background:none;padding:10px 16px;font-weight:700;cursor:pointer;border-radius:10px 10px 0 0;color:var(--muted);display:flex;gap:8px;align-items:center;margin-bottom:-2px;border-bottom:3px solid transparent}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--leaf);background:var(--panel)}
.tab svg{width:18px;height:18px}
.tabs .spacer{flex:1}
.qrbtn{margin-bottom:6px}
.pane{padding-top:22px}

.btn{border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 15px;cursor:pointer;font-weight:700;font-size:.9rem;display:inline-flex;gap:7px;align-items:center}
.btn:hover{border-color:var(--leaf)}
.btn.pri{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.btn.on{background:var(--pollen-soft);border-color:var(--pollen)}
.btn svg{width:16px;height:16px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.toolbar .hint{font-size:.82rem;color:var(--muted)}
.note{background:var(--pollen-soft);border-radius:var(--r);padding:12px 14px;font-size:.92rem;max-width:80ch;margin-bottom:14px}

/* ---------- Arbeitsblatt ---------- */
.sheet{background:var(--paper);max-width:820px;border:1px solid var(--line);border-radius:4px;padding:34px 38px 40px;box-shadow:0 1px 0 var(--line),0 12px 30px -18px rgba(20,40,25,.35);position:relative}
.ws-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px;font-size:.85rem}
.ws-meta{display:flex;gap:18px;flex-wrap:wrap}
.ws-meta label{display:flex;gap:6px;align-items:flex-end}
.ws-meta input{border:0;border-bottom:1px solid var(--muted);background:transparent;width:120px;padding:0 2px}
.ws-brand{color:var(--muted);font-weight:700}
.ws-title{font-size:1.75rem;margin-bottom:6px}
.ws-intro{margin:0 0 14px;max-width:68ch}
.blk{margin-top:24px;position:relative;break-inside:avoid}
.blk h3{font-size:1.06rem;display:flex;gap:10px;align-items:baseline;margin-bottom:10px}
.blk h3 .no{background:var(--ink);color:var(--paper);border-radius:6px;padding:1px 8px;font-size:.85rem;flex:none}
.blk p{margin:0}
.gap{line-height:2.25;max-width:70ch}
.sheet input.a{border:0;border-bottom:1.5px dashed var(--muted);background:transparent;padding:0 3px;min-width:4ch;text-align:center;font-weight:700;color:var(--sky)}
.sheet input.a.ok{border-bottom:2px solid var(--ok);background:var(--ok-soft)}
.sheet input.a.bad{border-bottom:2px solid var(--bad);background:var(--bad-soft)}
.sheet input.a.solv{color:var(--berry)}
.bank{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;margin-top:10px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.92rem}
.bank b{font-family:var(--f-display);margin-right:4px}
.fig{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center}
.fig svg{width:100%;height:auto;max-height:460px}
.labels{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.labels li{display:flex;gap:8px;align-items:center}
.labels input.a{flex:1;text-align:left}
.num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.8rem;font-weight:700;flex:none}
.tw{overflow-x:auto}
.sheet table{border-collapse:collapse;width:100%;font-size:.92rem}
.sheet th,.sheet td{border:1.5px solid var(--ink);padding:7px 8px;text-align:left;vertical-align:top}
.sheet th{background:var(--leaf-soft);font-family:var(--f-display)}
.sheet td input.a{width:100%;text-align:left}
.chain{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.chain .box{border:1.5px solid var(--ink);border-radius:8px;padding:8px 12px;min-width:110px;text-align:center;font-weight:700}
.chain .box input.a{width:100%}
.chain .arr{font-size:1.4rem;color:var(--leaf);font-weight:700}
.tf{display:grid;gap:6px}
.tf .row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;border-bottom:1px dotted var(--line);padding:4px 0}
.tf label{display:flex;gap:5px;align-items:center;font-size:.85rem;cursor:pointer}
.tf .row.ok{background:var(--ok-soft)} .tf .row.bad{background:var(--bad-soft)}
.tf input{width:18px;height:18px;accent-color:var(--leaf)}
.lines .ln{border-bottom:1px solid var(--muted);height:30px}
.lines textarea{width:100%;border:0;background:repeating-linear-gradient(transparent 0 29px,var(--muted) 29px 30px);line-height:30px;resize:vertical;min-height:90px;padding:0 2px;color:var(--sky);font:inherit;font-weight:700}
.solline{display:none;color:var(--berry);font-weight:700;font-size:.9rem;margin-top:6px}
.sheet.sol .solline{display:block}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px 24px}
.match ol{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.match li{display:flex;gap:8px;align-items:flex-start}
.match input.a{width:3ch;flex:none}
.match .letter{font-weight:700;font-family:var(--f-display);width:22px;flex:none}
.numlist{display:grid;gap:8px;list-style:none;padding:0;margin:0}
.numlist li{display:flex;gap:10px;align-items:center}
.numlist input.a{width:3ch;border:1.5px solid var(--ink)!important;border-radius:6px;height:30px}
.chartblk svg{max-width:520px;width:100%;height:auto}
.chartblk .bar{fill:var(--berry);opacity:0;transition:opacity .3s}
.sheet.sol .chartblk .bar{opacity:.85}
.del{position:absolute;right:-6px;top:-4px;display:none;border:0;background:var(--bad);color:#fff;border-radius:50%;width:26px;height:26px;cursor:pointer;font-weight:700}
.sheet.edit .del{display:block}
.sheet.edit [contenteditable="true"]{outline:1.5px dashed var(--pollen);outline-offset:3px;border-radius:3px}
.ws-foot{margin-top:28px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* figure styles */
.svgf .ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svgf .mk circle{fill:var(--ink)} .svgf .mk text{fill:var(--paper);font:700 12px var(--f-body);text-anchor:middle;dominant-baseline:central}
.svgf .lead{stroke:var(--ink);stroke-width:1.2;fill:none}
.svgf .tgt{fill:var(--ink)}
.f-petal{fill:var(--berry-soft);stroke:var(--berry);stroke-width:1.6}
.f-sepal{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.6}
.f-green{fill:var(--leaf-soft);stroke:var(--leaf);stroke-width:1.6}
.f-stem{fill:none;stroke:var(--leaf);stroke-width:6;stroke-linecap:round}
.f-pollen{fill:var(--pollen-soft);stroke:var(--pollen);stroke-width:1.6}
.f-pollen-solid{fill:var(--pollen)}
.f-ovule{fill:var(--paper);stroke:var(--ink);stroke-width:1.3}
.f-soil{fill:var(--soil)} .f-root{fill:none;stroke:var(--root);stroke-width:2.4;stroke-linecap:round}
.f-bone{fill:none;stroke:var(--bone);stroke-linecap:round}
.f-boneo{fill:none;stroke:var(--bone-line);stroke-linecap:round}
.f-bonefill{fill:var(--bone);stroke:var(--bone-line);stroke-width:1.5}
.f-body{fill:var(--sky-soft);stroke:var(--line);stroke-width:1.5}
.f-liver{fill:var(--liver);stroke:var(--ink);stroke-width:1.2;opacity:.9}
.f-stomach{fill:var(--berry-soft);stroke:var(--berry);stroke-width:1.6}
.f-pank{fill:var(--pollen-soft);stroke:var(--pollen);stroke-width:1.4}
.f-tube{fill:none;stroke:var(--sky);stroke-width:7;stroke-linecap:round}
.f-gut{fill:none;stroke:var(--gut);stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.f-colon{fill:none;stroke:var(--colon);stroke-width:16;stroke-linecap:round;stroke-linejoin:round}
.f-muted{fill:var(--muted)} .f-ink{fill:var(--ink)}
.t-small{font:12px var(--f-body);fill:var(--ink)}
.t-label{font:700 13px var(--f-body);fill:var(--ink)}

/* ---------- Simulationen ---------- */
.sim{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:980px}
.sim h2{font-size:1.35rem;margin-bottom:4px}
.sim .intro{color:var(--muted);max-width:72ch;margin:0 0 14px}
.simgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden;position:relative}
.stage canvas,.stage svg{display:block;width:100%;height:auto;touch-action:manipulation}
.ctrl{display:grid;gap:14px}
.ctrl label{display:grid;gap:4px;font-weight:700;font-size:.9rem}
.ctrl label span.v{font-weight:400;color:var(--muted);font-variant-numeric:tabular-nums}
.ctrl input[type=range]{width:100%;accent-color:var(--leaf);height:28px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stat{display:flex;gap:18px;flex-wrap:wrap;font-variant-numeric:tabular-nums}
.stat div{display:grid}
.stat b{font-family:var(--f-display);font-size:1.6rem;line-height:1}
.stat small{color:var(--muted);font-size:.78rem}
.info{background:var(--leaf-soft);border-radius:10px;padding:12px 14px;font-size:.95rem}
.info h3{font-size:1rem;margin-bottom:4px}
.key{display:flex;gap:12px;flex-wrap:wrap;font-size:.85rem}
.key button{display:flex;gap:6px;align-items:center;border:1.5px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 10px;cursor:pointer}
.key button[aria-pressed="true"]{border-color:var(--ink)}
.sw{width:14px;height:14px;border-radius:4px;display:inline-block}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--panel);font-weight:700;cursor:pointer}
.steps button[aria-current="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.limbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.limbs figure{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px}
.limbs figcaption{text-align:center;font-weight:700;font-family:var(--f-display)}
.keyq{font-size:1.15rem;font-family:var(--f-display);font-weight:700;margin:6px 0 14px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:.8rem;margin-bottom:10px}
.crumbs span{background:var(--leaf-soft);border-radius:99px;padding:2px 9px}

/* ---------- Quiz & Spiele ---------- */
.play{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px;max-width:760px}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 18px}
.prog i{display:block;height:100%;background:var(--leaf);transition:width .3s}
.qtext{font-size:1.25rem;font-family:var(--f-display);font-weight:700;margin-bottom:14px}
.opts{display:grid;gap:8px}
.opt{border:2px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;text-align:left;cursor:pointer;font-size:1rem;display:flex;gap:10px;align-items:center}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt .l{width:28px;height:28px;border-radius:50%;background:var(--leaf-soft);display:grid;place-items:center;font-weight:700;flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.fb{margin-top:12px;padding:12px 14px;border-radius:10px;background:var(--sky-soft)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:800;line-height:1}
.gsel{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tray{display:flex;flex-wrap:wrap;gap:8px;min-height:50px;padding:12px;border:2px dashed var(--line);border-radius:12px;margin-bottom:14px}
.card{border:2px solid var(--line);background:var(--paper);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.card.sel{border-color:var(--pollen);background:var(--pollen-soft);transform:translateY(-2px)}
.card.done{border-color:var(--ok);background:var(--ok-soft);cursor:default;font-weight:400;padding:4px 9px;font-size:.88rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.bin{border:2px solid var(--line);border-radius:12px;padding:10px;min-height:110px;cursor:pointer;background:var(--paper);display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.bin h4{margin:0 0 4px;font-family:var(--f-display);font-size:.98rem}
.bin.target{border-color:var(--pollen)}
.olist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.olist li{display:flex;gap:8px;align-items:center;border:2px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--paper)}
.olist li.ok{border-color:var(--ok);background:var(--ok-soft)} .olist li.bad{border-color:var(--bad)}
.olist li span{flex:1}
.olist button{border:1.5px solid var(--line);background:var(--panel);border-radius:8px;width:36px;height:34px;cursor:pointer;font-weight:700}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mcard{aspect-ratio:4/3;border-radius:12px;border:2px solid var(--line);background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;text-align:center;padding:6px;cursor:pointer;font-weight:700;font-size:.85rem;line-height:1.2;max-width:100%}
.mcard.open{background:var(--paper);color:var(--ink)}
.mcard.gone{background:var(--ok-soft);color:var(--ink);border-color:var(--ok);cursor:default}

/* ---------- Startseite ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px;align-items:center;max-width:1100px}
.hero h1{font-size:clamp(2rem,4.4vw,3.4rem);letter-spacing:-.025em;line-height:1.02}
.hero h1 em{font-style:normal;color:var(--leaf)}
.hero p{max-width:60ch;color:var(--muted);font-size:1.05rem}
.kinds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kind{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.kind b{font-family:var(--f-display);display:flex;gap:8px;align-items:center}
.kind b svg{width:20px;height:20px;color:var(--leaf)}
.kind small{color:var(--muted);display:block;margin-top:2px}
.overview{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px;margin-top:34px;max-width:1100px}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.kcard h2{font-size:1.25rem;display:flex;justify-content:space-between;align-items:baseline}
.kcard h2 small{font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:400}

/* ===== Arbeitsblatt-Engine ===== */
let blkSeq=0;
function ansInput(a){const first=a.split('/')[0];return `<input class="a" data-a="${esc(a)}" size="${Math.max(5,Math.min(28,first.length+2))}" aria-label="Antwort" autocomplete="off" autocapitalize="off" spellcheck="false">`}
function parseGaps(t){return t.split(/\{([^}]+)\}/).map((p,i)=>i%2?ansInput(p):p.replace(/___/g,'<input class="a blank" aria-label="Eintrag" autocomplete="off">')).join('')}
function answersOf(t){return [...t.matchAll(/\{([^}]+)\}/g)].map(m=>m[1].split('/')[0])}
function bankHTML(words){return `<div class="bank"><b>Wörterkasten:</b>${shuffle(words).map(w=>`<span>${esc(w)}</span>`).join('')}</div>`}
const LET='ABCDEFGHIJ';

function blockHTML(b,no){
  const id='b'+(++blkSeq);
  let body='';
  switch(b.t){
    case 'gap': body=`<p class="gap ed">${parseGaps(b.text)}</p>${b.bank?bankHTML(answersOf(b.text)):''}`;break;
    case 'fig':{
      if(b.img&&b.iw){const m=b.mx||110,iw=b.iw,ih=b.ih;
        const marks=b.labels.map((l,i)=>`<line x1="${l[0]}" y1="${l[1]}" x2="${l[3]}" y2="${l[4]}" stroke="#16241B" stroke-width="2.6"/><circle cx="${l[0]}" cy="${l[1]}" r="5.5" fill="#16241B" stroke="#fff" stroke-width="1.5"/><circle cx="${l[3]}" cy="${l[4]}" r="21" fill="#16241B"/><text x="${l[3]}" y="${l[4]}" fill="#fff" font-size="23" font-weight="700" text-anchor="middle" dominant-baseline="central" font-family="Atkinson Hyperlegible, sans-serif">${i+1}</text>`).join('');
        body=`<div class="fig wide"><div class="figimg"><svg viewBox="${-m} 0 ${iw+2*m} ${ih}" role="img" aria-label="Abbildung zum Beschriften"><image href="${AB_IMG[b.img]}" x="0" y="0" width="${iw}" height="${ih}"/>${marks}</svg></div><ol class="labels two">${b.labels.map((l,i)=>`<li><span class="num">${i+1}</span>${ansInput(l[2])}</li>`).join('')}</ol></div>${b.bank?bankHTML(b.labels.map(l=>l[2].split('/')[0])):''}`;break}
      if(b.img){body=`<div class="fig"><div class="svgf figimg"><img src="${AB_IMG[b.img]}" alt="Abbildung zum Beschriften"></div><ol class="labels">${b.labels.map((l,i)=>`<li><span class="num">${i+1}</span>${ansInput(l[2])}</li>`).join('')}</ol></div>${b.bank?bankHTML(b.labels.map(l=>l[2].split('/')[0])):''}`;break}
      const svg=SVG[b.svg]();
      const marks=b.labels.map((l,i)=>`<line class="lead" x1="${l[0]}" y1="${l[1]}" x2="${l[3]}" y2="${l[4]}"/><circle class="tgt" cx="${l[0]}" cy="${l[1]}" r="2.5"/><g class="mk"><circle cx="${l[3]}" cy="${l[4]}" r="10"/><text x="${l[3]}" y="${l[4]}">${i+1}</text></g>`).join('');
      body=`<div class="fig"><div class="svgf">${svg.replace('</svg>',marks+'</svg>')}</div><ol class="labels">${b.labels.map((l,i)=>`<li><span class="num">${i+1}</span>${ansInput(l[2])}</li>`).join('')}</ol></div>${b.bank?bankHTML(b.labels.map(l=>l[2].split('/')[0])):''}`;break;}
    case 'table':
      body=`<div class="tw"><table><thead><tr>${b.head.map(x=>`<th class="ed">${x}</th>`).join('')}</tr></thead><tbody>${b.rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/\{|___/.test(c)?'':'ed'}">${i===0?'<b>'+parseGaps(c)+'</b>':parseGaps(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;break;
    case 'chain':
      body=b.chains.map(ch=>`<div class="chain">${ch.map((x,i)=>`${i?'<span class="arr" aria-hidden="true">→</span>':''}<span class="box">${parseGaps(x)}</span>`).join('')}</div>`).join('')+`<p style="font-size:.85rem;color:var(--muted)">Der Pfeil bedeutet: „wird gefressen von“.</p>`;break;
    case 'tf':
      body=`<div class="tf">${b.items.map((it,i)=>`<div class="row" data-tf="${it[1]?'r':'f'}"><span class="ed">${it[0]}</span><label><input type="radio" name="${id}_${i}" value="r"> richtig</label><label><input type="radio" name="${id}_${i}" value="f"> falsch</label></div>`).join('')}</div>`;break;
    case 'write':
      body=`<div class="lines"><textarea rows="${b.lines||3}" aria-label="Antwort"></textarea></div>${b.sol?`<div class="solline ed">Lösungsidee: ${b.sol}</div>`:''}`;break;
    case 'match':{
      const order=shuffle(b.right.map((r,i)=>i));
      const letterOf=i=>LET[order.indexOf(i)];
      body=`<div class="match"><ol>${b.left.map((l,i)=>`<li><span class="num">${i+1}</span><span class="ed" style="flex:1">${l}</span>${ansInput(letterOf(i))}</li>`).join('')}</ol><ol>${order.map((ri,k)=>`<li><span class="letter">${LET[k]}</span><span class="ed">${b.right[ri]}</span></li>`).join('')}</ol></div>`;break;}
    case 'num':{
      const order=shuffle(b.items.map((x,i)=>i));
      body=`<ol class="numlist">${order.map(i=>`<li>${ansInput(String(i+1))}<span class="ed">${b.items[i]}</span></li>`).join('')}</ol>`;break;}
    case 'draw': body=`<div class="drawbox" style="height:${b.height||200}px" aria-label="Zeichenfeld"></div>`;break;
    case 'protocol':
      body=`<div class="proto"><div class="pr"><b>Forschungsfrage</b><p class="ed">${b.frage}</p></div><div class="pr"><b>Meine Vermutung</b><div class="lines"><textarea rows="2" aria-label="Vermutung"></textarea></div></div><div class="pr two"><div><b>Material</b><ul class="ed">${b.material.map(m=>`<li>${m}</li>`).join('')}</ul></div><div><b>Durchführung</b><ol class="ed">${b.steps.map(m=>`<li>${m}</li>`).join('')}</ol></div></div></div>`;break;
    case 'chart':{
      const W=480,H=230,L=40,B=30,T=10,n=b.cats.length,bw=(W-L-10)/n;
      let g=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Leeres Diagramm"><g>`;
      for(let v=0;v<=100;v+=10){const y=T+(H-T-B)*(1-v/100);g+=`<line x1="${L}" x2="${W-10}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/>${v%20===0?`<text class="t-small" x="${L-6}" y="${y+4}" text-anchor="end">${v} %</text>`:''}`}
      b.cats.forEach((c,i)=>{const x=L+bw*i;const v=b.vals[i];const y=T+(H-T-B)*(1-v/100);g+=`<rect class="bar" x="${x+bw*.2}" y="${y}" width="${bw*.6}" height="${H-B-y}"/><text class="t-small" x="${x+bw/2}" y="${H-10}" text-anchor="middle">${c}</text>`});
      g+=`<line x1="${L}" x2="${L}" y1="${T}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/><line x1="${L}" x2="${W-10}" y1="${H-B}" y2="${H-B}" stroke="var(--ink)" stroke-width="1.5"/></g></svg>`;
      body=`<div class="tw" style="margin-bottom:10px"><table style="max-width:520px"><tr><th>${b.xlabel}</th>${b.cats.map(c=>`<th>${c}</th>`).join('')}</tr><tr><td><b>${b.ylabel}</b></td>${b.vals.map(v=>`<td>${v} %</td>`).join('')}</tr></table></div><div class="chartblk">${g}</div>`;break;}
  }
  return `<section class="blk" data-t="${b.t}"><button class="del" title="Aufgabe entfernen" aria-label="Aufgabe entfernen">×</button><h3><span class="no">${no}</span><span class="ed">${b.h}</span></h3>${body}</section>`;
}

function sheetHTML(topic,S,vi){
  blkSeq=0;
  return `<div class="ws-head"><div class="ws-meta"><label>Name: <input aria-label="Name"></label><label>Klasse: <input aria-label="Klasse" style="width:60px"></label><label>Datum: <input aria-label="Datum" style="width:90px"></label></div><div class="ws-brand">Biologie · ${topic.k}. Klasse · Blatt ${'ABCDE'[vi]}</div></div>

  <div class="ws-foot"><span>Biologie-Werkstatt · Lehrplan Biologie und Umweltbildung (MS)</span><span class="ed">${topic.title}</span></div>`;

function renderSheet(topic,host){
  const sheets=topic.sheets||[topic.sheet];
  let vi=+(store.get('vi:'+topic.id)||0);if(!(vi<sheets.length))vi=0;
  const S=sheets[vi];
  const key='sheet:'+topic.id+(vi?':'+vi:'');
  const saved=store.get(key);
  if(sheets.length>1){const vs=h('div',{class:'variants',role:'group','aria-label':'Arbeitsblatt wählen'});
    sheets.forEach((x,i)=>vs.append(h('button',{class:'variant'+(i===vi?' on':''),'aria-pressed':i===vi,onclick:()=>{store.set('vi:'+topic.id,i);host.innerHTML='';renderSheet(topic,host)}},h('b',{},'Blatt '+'ABCDE'[i]),h('span',{},x.label||''),h('small',{},x.title))));
    host.append(vs)}
  const sheet=h('article',{class:'sheet',id:'sheet'});
  sheet.innerHTML=saved||sheetHTML(topic,S,vi);
  const bEdit=h('button',{class:'btn',html:IC.edit+'Bearbeiten'});
  const bCheck=h('button',{class:'btn pri',html:IC.check+'Prüfen'});
  const bSol=h('button',{class:'btn',html:IC.eye+'Lösungen'});
  const bNew=h('button',{class:'btn',html:IC.reset+'Neu mischen'});
  const bAdd=h('button',{class:'btn',html:IC.plus+'Aufgabe hinzufügen',hidden:true});
  const bReset=h('button',{class:'btn',html:IC.reset+'Original',hidden:!saved});
  const bBank=h('button',{class:'btn on',html:IC.sheet+'Wörterkasten',title:'Wörterkasten ein- oder ausblenden (leichter / schwieriger)'});
  const bImg=h('button',{class:'btn',html:IC.img+'Bild einfügen'});
  const bPrint=isFramed?null:h('button',{class:'btn',html:IC.print+'Drucken / PDF',onclick:()=>{if(sheet.classList.contains('edit'))bEdit.click();window.print()}});
  const hint=h('span',{class:'hint'},isFramed?'Drucken: Werkstatt über GitHub Pages öffnen, dort „Drucken / PDF“.':'');
  host.append(h('div',{class:'toolbar'},bCheck,bSol,bEdit,bImg,bAdd,bBank,bNew,bReset,bPrint,hint));
  if(topic.note)host.append(h('div',{class:'note',html:topic.note}));
  host.append(sheet);

  if(!$('.bank',sheet))bBank.hidden=true;
  bBank.classList.toggle('on',!sheet.classList.contains('nobank'));
  if(saved&&/nobank/.test(store.get(key+':cls')||''))sheet.classList.add('nobank'),bBank.classList.remove('on');
  bBank.onclick=()=>{const off=sheet.classList.toggle('nobank');bBank.classList.toggle('on',!off);store.set(key+':cls',off?'nobank':'');if(!store.get(key))save()};
  let lastBlk=null;
  sheet.addEventListener('pointerdown',e=>{const b=e.target.closest('.blk');if(b)lastBlk=b});
  const insertDeco=html=>{const fig=document.createElement('figure');fig.className='deco r m';fig.contentEditable='false';fig.innerHTML=html+'<span class="deco-ctl"><button data-d="s" title="kleiner" aria-label="kleiner">−</button><button data-d="l" title="größer" aria-label="größer">+</button><button data-d="f" title="Seite wechseln" aria-label="Seite wechseln">⇆</button><button data-d="x" title="entfernen" aria-label="entfernen">×</button></span>';
    if(lastBlk&&sheet.contains(lastBlk))$('h3',lastBlk).after(fig);else $('.ws-title',sheet).after(fig);save()};
  bImg.onclick=()=>{if(!sheet.classList.contains('edit'))bEdit.click();openLibrary(insertDeco)};
  sheet.addEventListener('click',e=>{const d=e.target.closest('[data-d]');if(!d)return;const fig=d.closest('figure.deco');const sz=['s','m','l','xl'];let cur=sz.findIndex(x=>fig.classList.contains(x));
    if(d.dataset.d==='x')fig.remove();else if(d.dataset.d==='f'){fig.classList.toggle('r');fig.classList.toggle('lft')}else{const n=Math.max(0,Math.min(3,cur+(d.dataset.d==='l'?1:-1)));fig.classList.remove(...sz);fig.classList.add(sz[n])}save()});
  const save=()=>{const c=sheet.cloneNode(true);c.classList.remove('edit','sol');$$('[contenteditable]',c).forEach(e=>e.removeAttribute('contenteditable'));$$('input.a',c).forEach(i=>i.classList.remove('ok','bad','solv'));$$('.row',c).forEach(r=>r.classList.remove('ok','bad'));store.set(key,c.innerHTML);bReset.hidden=false};
  let tmr;sheet.addEventListener('input',e=>{if(sheet.classList.contains('edit')&&e.target.isContentEditable){clearTimeout(tmr);tmr=setTimeout(save,500)}});
  bEdit.onclick=()=>{const on=sheet.classList.toggle('edit');bEdit.classList.toggle('on',on);bAdd.hidden=!on;$$('.ed',sheet).forEach(e=>{if(on)e.contentEditable='true';else e.removeAttribute('contenteditable')});bEdit.innerHTML=IC.edit+(on?'Fertig':'Bearbeiten');if(!on)save()};
  bAdd.onclick=()=>{const wrap=$('.blks',sheet);const n=$$('.blk',sheet).length+1;wrap.insertAdjacentHTML('beforeend',blockHTML({t:'write',h:'Neue Aufgabe – hier tippen',lines:3},n));$$('.ed',wrap.lastElementChild).forEach(e=>e.contentEditable='true');renumber();save()};
  const renumber=()=>$$('.blk .no',sheet).forEach((e,i)=>e.textContent=i+1);
  sheet.addEventListener('click',e=>{if(e.target.classList.contains('del')){e.target.closest('.blk').remove();renumber();save()}});
  bCheck.onclick=()=>{
    $$('input.a',sheet).forEach(i=>{if(!i.dataset.a)return;if(!i.value.trim()){i.classList.remove('ok','bad');return}const ok=i.dataset.a.split('/').some(a=>norm(a)===norm(i.value));i.classList.toggle('ok',ok);i.classList.toggle('bad',!ok)});
    $$('.tf .row',sheet).forEach(r=>{const c=$('input:checked',r);r.classList.remove('ok','bad');if(c)r.classList.add(c.value===r.dataset.tf?'ok':'bad')});
  };
  bSol.onclick=()=>{
    const on=sheet.classList.toggle('sol');bSol.classList.toggle('on',on);
    $$('input.a',sheet).forEach(i=>{if(!i.dataset.a)return;if(on){i.dataset.prev=i.value;i.value=i.dataset.a.split('/')[0];i.classList.add('solv');i.classList.remove('ok','bad')}else{i.value=i.dataset.prev||'';i.classList.remove('solv')}});
    $$('.tf .row',sheet).forEach(r=>{if(on){const x=$(`input[value="${r.dataset.tf}"]`,r);r.dataset.prev=($('input:checked',r)||{}).value||'';x.checked=true}else{$$('input',r).forEach(x=>x.checked=x.value===r.dataset.prev)}});
  };
  bNew.onclick=()=>{store.del(key);store.del(key+':cls');host.innerHTML='';renderSheet(topic,host)};
  bReset.onclick=()=>{store.del(key);store.del(key+':cls');host.innerHTML='';renderSheet(topic,host)};
  bNew.title='Wörterkasten, Zuordnungen und Reihenfolgen neu mischen (setzt Bearbeitungen zurück)';
}

/* ===== Quiz ===== */
function renderQuiz(topic,host){
  const box=h('div',{class:'play'});host.append(box);
  let qs,idx,score;
  const start=()=>{qs=shuffle(topic.quiz).map(q=>({...q,opts:shuffle(q.o.map((t,i)=>({t,c:i===0})))}));idx=0;score=0;show()};
  const show=()=>{
    box.innerHTML='';
    if(idx>=qs.length){
      const p=score/qs.length;
      box.append(h('div',{class:'eyebrow'},'Ergebnis'),h('div',{class:'big'},`${score} / ${qs.length}`),
        h('p',{},p===1?'Perfekt! Du bist Expertin bzw. Experte für dieses Thema.':p>=.75?'Sehr gut gemacht!':p>=.5?'Gut – schau dir die Erklärungen noch einmal an.':'Übung macht den Meister – probier es gleich nochmal!'),
        h('button',{class:'btn pri',onclick:start,html:IC.reset+'Nochmal spielen'}));return}
    const q=qs[idx];
    box.append(h('div',{class:'row',style:'justify-content:space-between'},h('span',{class:'eyebrow'},`Frage ${idx+1} von ${qs.length}`),h('span',{class:'eyebrow'},`Punkte: ${score}`)),
      h('div',{class:'prog'},h('i',{style:`width:${idx/qs.length*100}%`})),h('div',{class:'qtext'},q.q));
    const opts=h('div',{class:'opts'});box.append(opts);
    q.opts.forEach((o,i)=>opts.append(h('button',{class:'opt',onclick:e=>{
      $$('.opt',opts).forEach(b=>b.disabled=true);
      const btn=e.currentTarget;
      if(o.c){btn.classList.add('right');score++}else{btn.classList.add('wrong');$$('.opt',opts)[q.opts.findIndex(x=>x.c)].classList.add('right')}
      box.append(h('div',{class:'fb'},h('b',{},o.c?'Richtig! ':'Leider falsch. '),q.e||''),h('div',{style:'margin-top:12px'},h('button',{class:'btn pri',onclick:()=>{idx++;show()}},idx+1<qs.length?'Weiter →':'Zum Ergebnis')));
    }},h('span',{class:'l'},LET[i]),o.t)));
  };
  start();
}

/* ===== Spiele ===== */
function renderGames(topic,host){
  const games=topic.games;let cur=0;
  const sel=h('div',{class:'gsel'});const area=h('div');
  if(games.length>1)host.append(sel);host.append(area);
  const pick=i=>{cur=i;$$('button',sel).forEach((b,j)=>b.classList.toggle('on',j===i));area.innerHTML='';GAME[games[i].type](games[i],area)};
  games.forEach((g,i)=>sel.append(h('button',{class:'btn',onclick:()=>pick(i)},g.title)));
  pick(0);
}
const GAME={
  sort(g,host){
    const box=h('div',{class:'play',style:'max-width:980px'});host.append(box);
    const run=()=>{
      box.innerHTML='';let picked=null,errors=0,left=g.items.length;
      box.append(h('h2',{style:'font-size:1.2rem'},g.title),h('p',{class:'intro',style:'color:var(--muted);margin:4px 0 12px'},'Tippe zuerst eine Karte an, dann das passende Feld.'));
      const tray=h('div',{class:'tray'});const bins=h('div',{class:'bins'});
      const status=h('p',{class:'eyebrow'},`Noch ${left} Karten · Fehler: 0`);
      box.append(tray,bins,status);
      shuffle(g.items).forEach(([t,c])=>{const card=h('button',{class:'card'},t);card.dataset.c=c;card.onclick=()=>{if(card.classList.contains('done'))return;$$('.card',tray).forEach(x=>x.classList.remove('sel'));picked=card;card.classList.add('sel');$$('.bin',bins).forEach(b=>b.classList.add('target'))};tray.append(card)});
      g.cats.forEach(c=>{const bin=h('div',{class:'bin',role:'button',tabindex:'0'},h('h4',{},c));bin.onclick=()=>{if(!picked)return;
        if(picked.dataset.c===c){picked.classList.remove('sel');picked.classList.add('done');bin.append(picked);picked=null;left--;$$('.bin',bins).forEach(b=>b.classList.remove('target'))}
        else{errors++;const p=picked;p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');bin.classList.remove('shake');void bin.offsetWidth;bin.classList.add('shake')}
        status.textContent=left?`Noch ${left} Karten · Fehler: ${errors}`:'';
        if(!left){box.append(h('div',{class:'fb'},h('b',{},errors===0?'Fehlerfrei geschafft! ':'Geschafft! '),`Du hast ${errors} Fehler gemacht.`),h('div',{style:'margin-top:10px'},h('button',{class:'btn pri',onclick:run,html:IC.reset+'Nochmal'})))}
      };bin.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();bin.click()}};bins.append(bin)});
    };run();
  },
  order(g,host){
    const box=h('div',{class:'play'});host.append(box);
    const run=()=>{
      box.innerHTML='';let arr=shuffle(g.items);while(g.items.length>2&&arr.every((x,i)=>x===g.items[i]))arr=shuffle(g.items);
      box.append(h('h2',{style:'font-size:1.2rem'},g.title),h('p',{style:'color:var(--muted);margin:4px 0 12px'},g.hint||'Bringe die Karten mit den Pfeilen in die richtige Reihenfolge.'));
      const list=h('ol',{class:'olist'});const fb=h('div');let tries=0;
      const draw=(marks)=>{list.innerHTML='';arr.forEach((t,i)=>{const li=h('li',{class:marks?(t===g.items[i]?'ok':'bad'):''},h('span',{class:'num'},i+1),h('span',{},t),
        h('button',{'aria-label':'nach oben',disabled:i===0,onclick:()=>{[arr[i-1],arr[i]]=[arr[i],arr[i-1]];draw()}},'↑'),
        h('button',{'aria-label':'nach unten',disabled:i===arr.length-1,onclick:()=>{[arr[i+1],arr[i]]=[arr[i],arr[i+1]];draw()}},'↓'));list.append(li)})};
      draw();
      box.append(list,h('div',{class:'row',style:'margin-top:14px'},h('button',{class:'btn pri',html:IC.check+'Prüfen',onclick:()=>{tries++;draw(true);const ok=arr.every((x,i)=>x===g.items[i]);fb.innerHTML='';fb.append(h('div',{class:'fb'},ok?`Richtig! Geschafft mit ${tries} ${tries===1?'Versuch':'Versuchen'}.`:'Grün ist richtig. Verschiebe die roten Karten und prüfe nochmal.'))}}),h('button',{class:'btn',html:IC.reset+'Neu mischen',onclick:run})),fb);
    };run();
  },
  memory(g,host){
    const box=h('div',{class:'play',style:'max-width:820px'});host.append(box);
    const run=()=>{
      box.innerHTML='';let open=[],moves=0,found=0,lock=false;
      const st=h('p',{class:'eyebrow'},'Züge: 0');
      box.append(h('h2',{style:'font-size:1.2rem'},g.title),h('p',{style:'color:var(--muted);margin:4px 0 12px'},'Finde die Paare, die zusammengehören.'),st);
      const grid=h('div',{class:'mem'});box.append(grid);
      shuffle(g.pairs.flatMap((p,i)=>[{t:p[0],i},{t:p[1],i}])).forEach(c=>{const el=h('button',{class:'mcard','aria-label':'verdeckte Karte'},'?');
        el.onclick=()=>{if(lock||el.classList.contains('open')||el.classList.contains('gone'))return;el.classList.add('open');el.textContent=c.t;open.push([el,c]);
          if(open.length===2){moves++;st.textContent='Züge: '+moves;const[[a,ca],[b,cb]]=open;
            if(ca.i===cb.i){a.classList.add('gone');b.classList.add('gone');open=[];found++;if(found===g.pairs.length)box.append(h('div',{class:'fb',style:'margin-top:12px'},h('b',{},'Alle Paare gefunden! '),`Du hast ${moves} Züge gebraucht.`),h('div',{style:'margin-top:10px'},h('button',{class:'btn pri',onclick:run,html:IC.reset+'Nochmal'})))}
            else{lock=true;setTimeout(()=>{[a,b].forEach(x=>{x.classList.remove('open');x.textContent='?'});open=[];lock=false},1100)}}};
        grid.append(el)});
    };run();
  }
};

{id:'selektion',k:1,title:'Natürliche und künstliche Selektion',lp:'Veränderungen in Populationen durch natürliche und künstliche Selektion',konz:['Evolution und Verwandtschaft','Reproduktion'],
 sheet:{title:'Wie sich Populationen verändern',intro:'Eine <b>Population</b> sind alle Lebewesen einer Art, die in einem Gebiet zusammenleben. Die einzelnen Tiere unterscheiden sich ein wenig voneinander.',blocks:[
  {t:'gap',h:'Der Birkenspanner',bank:true,text:'Der Birkenspanner ist ein Nachtfalter. Tagsüber sitzt er auf Baumrinde. Es gibt helle und {dunkle} Falter. Früher waren die Birkenrinden hell. Vögel fanden die dunklen Falter leichter, deshalb überlebten mehr {helle} Falter. Durch den Ruß aus Fabriken wurden die Rinden {dunkel/schwarz}. Nun wurden die hellen Falter öfter {gefressen}. Die dunklen Falter überlebten und bekamen mehr {Nachkommen/Junge}. So veränderte sich die Population. Diesen Vorgang nennt man natürliche {Selektion/Auslese}.'},
  {t:'chart',h:'Zeichne ein Säulendiagramm zum Anteil dunkler Birkenspanner in einer englischen Industriegegend (gerundete Werte).',xlabel:'Jahr',ylabel:'dunkle Falter',cats:['1850','1880','1900','1970','2000'],vals:[2,50,90,90,20]},
  {t:'gap',h:'Künstliche Selektion',bank:true,text:'Bei der künstlichen Selektion wählt der {Mensch} aus, welche Tiere oder Pflanzen sich fortpflanzen dürfen. Das nennt man {Züchtung/Zucht}. Alle Hunderassen stammen vom {Wolf} ab. Aus dem Wildkohl wurden zum Beispiel Kohlrabi, Brokkoli und {Karfiol/Blumenkohl} gezüchtet.'},
  {t:'write',h:'Erkläre den Unterschied zwischen natürlicher und künstlicher Selektion in eigenen Worten.',lines:4,sol:'Natürliche Selektion: Die Umwelt (z. B. Fressfeinde, Klima) entscheidet, wer überlebt und Nachkommen hat. Künstliche Selektion: Der Mensch wählt Tiere oder Pflanzen mit gewünschten Merkmalen für die Vermehrung aus.'}
 ]},

const CLIP_CATS=['Alle','Tiere','Pflanzen','Mensch'];
const clipSVG=c=>`<img src="${c[3]}" alt="${c[1]}">`;

function shrinkImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const m=480,k=Math.min(1,m/Math.max(im.width,im.height));const cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);res(cv.toDataURL(/png/.test(file.type)?'image/png':'image/jpeg',.85))};im.src=fr.result};fr.readAsDataURL(file)})}

function libraryGrid(onPick){
  let cat='Alle',q='';
  const wrap=h('div',{class:'lib'});const chips=h('div',{class:'row'});const grid=h('div',{class:'libgrid'});
  const search=h('input',{type:'search',id:'libsearch',placeholder:'Bild suchen, z. B. Igel',class:'libsearch','aria-label':'Bild suchen'});
  const draw=()=>{grid.innerHTML='';const list=CLIPS.filter(c=>(cat==='Alle'||c[2]===cat)&&norm(c[1]).includes(norm(q)));
    if(!list.length)grid.append(h('p',{style:'color:var(--muted)'},'Kein Bild gefunden. Probier ein anderes Wort oder lade ein eigenes Bild hoch.'));
    list.forEach(c=>grid.append(h('button',{class:'libitem',title:c[1],onclick:()=>onPick(clipSVG(c),c)},h('span',{html:clipSVG(c)}),h('small',{},c[1]))));
    $$('button',chips).forEach(b=>b.classList.toggle('on',b.textContent===cat))};
  CLIP_CATS.forEach(c=>chips.append(h('button',{class:'btn',onclick:()=>{cat=c;draw()}},c)));
  search.oninput=()=>{q=search.value;draw()};
  const up=h('input',{type:'file',accept:'image/*',id:'libupload',hidden:true});
  up.onchange=async()=>{const f=up.files[0];if(!f)return;try{const url=await shrinkImage(f);onPick(`<img src="${url}" alt="">`,null)}catch(e){upMsg.textContent='Das Bild konnte nicht geladen werden.'}};
  const upMsg=h('span',{class:'hint',style:'font-size:.82rem;color:var(--muted)'},'Eigene Bilder werden verkleinert und nur auf diesem Gerät gespeichert.');
  wrap.append(h('div',{class:'row',style:'margin-bottom:10px'},search,h('button',{class:'btn',html:IC.img+'Eigenes Bild hochladen',onclick:()=>up.click()}),up),upMsg,chips,grid);
  draw();return wrap;
}
function openLibrary(cb){
  const m=h('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove()}});
  const box=h('div',{class:'libmodal'},h('div',{class:'row',style:'justify-content:space-between;margin-bottom:8px'},h('h2',{style:'font-size:1.2rem'},'Bilderbibliothek'),h('button',{class:'btn',onclick:()=>m.remove()},'Schließen')),
    h('p',{style:'margin:0 0 10px;color:var(--muted);font-size:.9rem'},'Tippe ein Bild an – es kommt in die zuletzt angetippte Aufgabe. Danach kannst du es mit − + ⇆ × anpassen.'),
    libraryGrid(html=>{cb(html);m.remove()}));
  m.append(box);document.body.append(m);setTimeout(()=>$('#libsearch',box)?.focus(),50);
}
function libraryPage(main){
  document.title='Bilderbibliothek · Biologie-Werkstatt';
  main.append(h('header',{class:'t-head'},h('div',{class:'eyebrow'},'Werkzeug'),h('h1',{},'Bilderbibliothek'),
    h('p',{class:'lp'},`${CLIPS.length} Bilder zum Verzieren deiner Arbeitsblätter, dazu eigene Bilder hochladen. So geht's: Arbeitsblatt öffnen → „Bild einfügen“. Hier kannst du stöbern und ein Bild ansehen.`)));
  const prev=h('div',{class:'libprev'},h('p',{style:'color:var(--muted)'},'Tippe ein Bild an, um es groß zu sehen.'));
  main.append(h('div',{class:'simgrid',style:'margin-top:18px'},libraryGrid((html,c)=>{prev.innerHTML='';prev.append(h('div',{class:'libbig',html}),h('h3',{},c?c[1]:'Eigenes Bild'),h('p',{style:'color:var(--muted);font-size:.9rem'},'Zum Einfügen ein Arbeitsblatt öffnen und „Bild einfügen“ wählen.'))}),prev));
}

const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim()||'#888';

/* ---------- Birkenspanner ---------- */
birkenspanner(host){
  const s=simFrame(host,'Birkenspanner-Jagd: Du bist der Vogel!','Tippe so schnell du kannst auf Falter, um sie zu „fressen“ – du hast 8 Sekunden. Die Überlebenden bekommen Nachkommen. Beobachte über mehrere Generationen, wie sich die Farbe der Population verändert.');
  const cv=h('canvas',{'aria-label':'Baumrinde mit Faltern'});const stage=h('div',{class:'stage'},cv);
  let bark='hell',moths=[],gen=1,hist=[],timer=null,left=0,eaten=0,dims,texture=null;const N=24;

  const place=()=>{const{w,h:hh}=dims;moths.forEach(m=>{m.x=20+Math.random()*(w-40);m.y=20+Math.random()*(hh-40);m.r=Math.random()*6.28;m.alive=true})};
  const makeTex=()=>{const{w,h:hh}=dims;const o=document.createElement('canvas');o.width=w;o.height=hh;const c=o.getContext('2d');const light=bark==='hell';
    c.fillStyle=light?'#E7E2D3':'#3B3733';c.fillRect(0,0,w,hh);let seed=7;const rnd=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
    for(let i=0;i<w*hh/120;i++){c.fillStyle=light?`rgba(60,55,45,${.08+rnd()*.25})`:`rgba(${rnd()<.5?20:70},${rnd()<.5?18:64},${rnd()<.5?15:58},${.3+rnd()*.5})`;c.fillRect(rnd()*w,rnd()*hh,4+rnd()*26,1+rnd()*3)}
    if(light)for(let i=0;i<w*hh/1800;i++){c.fillStyle='rgba(35,32,28,.75)';c.fillRect(rnd()*w,rnd()*hh,10+rnd()*30,2+rnd()*4)}
    texture=o};
  const draw=()=>{const{c,w,h:hh}=dims;if(!texture)makeTex();c.drawImage(texture,0,0,w,hh);
    moths.forEach(m=>{if(!m.alive)return;c.save();c.translate(m.x,m.y);c.rotate(m.r);c.fillStyle=m.dark?'#26221E':'#EAE5D7';c.strokeStyle=m.dark?'#14110f':'#B9B2A0';c.lineWidth=.8;
      c.beginPath();c.moveTo(0,-2);c.quadraticCurveTo(-16,-12,-15,6);c.quadraticCurveTo(-6,6,0,2);c.quadraticCurveTo(6,6,15,6);c.quadraticCurveTo(16,-12,0,-2);c.fill();c.stroke();
      if(!m.dark){c.fillStyle='rgba(40,35,30,.55)';for(const[dx,dy]of[[-8,0],[-11,3],[8,0],[11,3],[-5,-2],[5,-2]])c.fillRect(dx,dy,1.6,1.6)}
      c.fillStyle=m.dark?'#100e0c':'#8E8775';c.fillRect(-1.2,-4,2.4,9);c.restore()});
    if(left>0){c.fillStyle='rgba(0,0,0,.55)';c.fillRect(8,8,150,28);c.fillStyle='#fff';c.font='bold 15px sans-serif';c.fillText(`Zeit: ${left} s · gefressen: ${eaten}`,16,27)}};
  const chart=h('div');const genLbl=h('b',{},'1'),darkLbl=h('b',{},'0 %');
  const drawChart=()=>{const W=300,H=120;let g=`<svg viewBox="0 0 ${W} ${H+22}" style="width:100%"><line x1="24" y1="${H}" x2="${W}" y2="${H}" stroke="var(--ink)"/>`;
    [0,50,100].forEach(v=>g+=`<text x="20" y="${H-v/100*(H-8)+4}" text-anchor="end" class="t-small" style="font-size:10px">${v}</text>`);
    const all=[...hist,pct()];const bw=Math.min(26,(W-30)/Math.max(all.length,8));
    all.forEach((v,i)=>{const bh=v/100*(H-8);g+=`<rect x="${28+i*bw}" y="${H-bh}" width="${bw-3}" height="${bh}" style="fill:var(--ink);opacity:${i===all.length-1?1:.55}"/><text x="${28+i*bw+bw/2-1.5}" y="${H+14}" text-anchor="middle" class="t-small" style="font-size:9px">${i+1}</text>`});
    chart.innerHTML=g+'</svg><div style="font-size:.8rem;color:var(--muted)">Anteil dunkler Falter (%) je Generation</div>';genLbl.textContent=gen;darkLbl.textContent=pct()+' %'};
  const nextGen=()=>{const surv=moths.filter(m=>m.alive);hist.push(pct());const nm=[];for(let i=0;i<N;i++){const p=surv[Math.floor(Math.random()*surv.length)]||{dark:Math.random()<.5};let d=p.dark;if(Math.random()<.03)d=!d;nm.push({dark:d})}moths=nm;gen++;place();draw();drawChart()};
  const bPlay=h('button',{class:'btn pri'},'Jagd starten (8 s)');
  const endRound=()=>{clearInterval(timer);timer=null;left=0;bPlay.disabled=false;draw();setTimeout(nextGen,700)};

    const m=moths.filter(m=>m.alive).find(m=>Math.hypot(m.x-x,m.y-y)<20);if(m){m.alive=false;eaten++;if(eaten>=N/2)endRound();else draw()}});

    h('div',{class:'row'},bPlay,bAuto,h('button',{class:'btn',onclick:reset},'Neu')),chart,

  ro.observe(stage);mkPop(.5);dims=fitCanvas(cv,.62);place();draw();drawChart();
  return()=>{clearInterval(timer);clearInterval(s._it);ro.disconnect()};
},

/* ---------- Arm: Gegenspieler ---------- */
arm(host){
  const s=simFrame(host,'Bizeps und Trizeps: Gegenspieler','Bewege den Regler und beobachte die beiden Muskeln. Ein Muskel kann nur ziehen – zum Strecken braucht es den Gegenspieler.');
  const stage=h('div',{class:'stage'});const info=h('div',{class:'info'});
  const lens=(a,b,bulge,side)=>{const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2,dx=b[0]-a[0],dy=b[1]-a[1],L=Math.hypot(dx,dy),nx=-dy/L*side,ny=dx/L*side;
    return `M${a[0]},${a[1]} Q${mx+nx*bulge},${my+ny*bulge} ${b[0]},${b[1]} Q${mx+nx*bulge*.25},${my+ny*bulge*.25} ${a[0]},${a[1]} Z`};
  const draw=deg=>{const t=deg*Math.PI/180;const S=[160,44],E=[160,174],d=[Math.sin(t),Math.cos(t)];const Wr=[E[0]+135*d[0],E[1]+135*d[1]];
    const bIns=[E[0]+28*d[0]-6*d[1],E[1]+28*d[1]+6*d[0]],tIns=[E[0]-14*d[0],E[1]-14*d[1]];
    const flex=deg/140;const bul=34+46*flex,tbul=30+30*(1-flex);

      <circle cx="160" cy="40" r="20" class="f-bonefill"/>

      <line x1="${S[0]}" y1="${S[1]}" x2="${E[0]}" y2="${E[1]}" class="f-boneo" stroke-width="17"/><line x1="${S[0]}" y1="${S[1]}" x2="${E[0]}" y2="${E[1]}" class="f-bone" stroke-width="13"/>
      <line x1="${E[0]}" y1="${E[1]}" x2="${Wr[0]}" y2="${Wr[1]}" class="f-boneo" stroke-width="13"/><line x1="${E[0]}" y1="${E[1]}" x2="${Wr[0]}" y2="${Wr[1]}" class="f-bone" stroke-width="9"/>
      <circle cx="${E[0]}" cy="${E[1]}" r="11" class="f-bonefill"/>
      <path d="${bic}" style="fill:${flex>=.5?'var(--berry)':'var(--berry-soft)'};stroke:var(--berry);stroke-width:1.5"/>
      <circle cx="${Wr[0]+12*d[0]}" cy="${Wr[1]+12*d[1]}" r="15" style="fill:var(--sky-soft);stroke:var(--sky);stroke-width:1.5"/>
      <text x="${(S[0]+bIns[0])/2+bul*.55+8}" y="${(S[1]+bIns[1])/2+4}" class="t-label">Bizeps</text>
      <text x="${S[0]-tbul*.55-14}" y="${(S[1]+tIns[1])/2+4}" class="t-label" text-anchor="end">Trizeps</text>

    info.innerHTML=deg>70?'<h3>Arm gebeugt</h3><b>Bizeps</b> zieht sich zusammen: kurz und dick. <b>Trizeps</b> ist entspannt und wird gedehnt.':deg<40?'<h3>Arm gestreckt</h3><b>Trizeps</b> zieht sich zusammen. <b>Bizeps</b> ist entspannt und wird gedehnt.':'<h3>Halb gebeugt</h3>Beide Muskeln arbeiten zusammen und halten den Arm in Position.'};
  s.append(h('div',{class:'simgrid'},stage,h('div',{class:'ctrl'},slider('Arm beugen',0,140,1,30,v=>v+'°',draw),info,
    h('div',{class:'note',style:'margin:0'},h('b',{},'Selbstversuch: '),'Leg eine Hand auf deinen Oberarm und beuge und strecke den anderen Arm. Wo spürst du, dass der Muskel hart wird?'))));draw(30);
},

/* ---------- Reise eines Bissens ---------- */
verdauung(host){
  const s=simFrame(host,'Die Reise eines Bissens','Begleite ein Stück Vollkornbrot auf seinem Weg durch den Körper. Tippe auf „Weiter“.');
  const st=[['Mund','etwa 1 Minute','Die Zähne zerkleinern das Brot. Speichel macht es gleitfähig und beginnt schon, Stärke in Zucker zu zerlegen. (Kau lange – dann schmeckt Brot süßlich!)',[130,60]],
    ['Speiseröhre','etwa 10 Sekunden','Muskeln schieben den Bissen wellenartig nach unten – sogar im Handstand.',[132,105]],
    ['Magen','2–4 Stunden','Der Magen knetet den Brei. Magensaft mit Säure tötet Keime und beginnt, Eiweiß zu zerlegen.',[178,172]],
    ['Dünndarm','3–6 Stunden','Galle aus der Leber und Saft aus der Bauchspeicheldrüse zerlegen die Nährstoffe. Über die Darmzotten gelangen sie ins Blut. Der Dünndarm ist 5–7 Meter lang!',[134,263]],
    ['Dickdarm','bis zu 1–2 Tage','Dem Brei wird Wasser entzogen. Darmbakterien helfen, Ballaststoffe abzubauen.',[134,224]],
    ['Mastdarm und After','am Ende','Unverdauliche Reste werden gesammelt und als Stuhl ausgeschieden.',[130,352]]];
  const svgStr=SVG.verdauung().replace('</svg>',`<path id="trk" d="${TRACT_PATH}" style="fill:none;stroke:none"/><circle id="bit" r="8" style="fill:var(--root);stroke:var(--paper);stroke-width:2"/></svg>`);
  const stage=h('div',{class:'stage',html:svgStr,style:'max-width:420px'});
  const path=$('#trk',stage),bit=$('#bit',stage);const total=path.getTotalLength();
  const lens=[];let from=0;st.forEach(x=>{let best=from,bd=1e9;for(let L=from;L<=total;L+=2){const p=path.getPointAtLength(L);const d=Math.hypot(p.x-x[3][0],p.y-x[3][1]);if(d<bd){bd=d;best=L}}lens.push(best);from=best});
  let cur=0,pos=0,raf;const info=h('div',{class:'info'});const steps=h('div',{class:'steps'});
  const put=L=>{const p=path.getPointAtLength(L);bit.setAttribute('cx',p.x);bit.setAttribute('cy',p.y)};
  const go=n=>{cancelAnimationFrame(raf);const a=pos,b=lens[n],t0=performance.now(),dur=Math.min(2200,200+Math.abs(b-a)*4);
    const an=t=>{const k=Math.min(1,(t-t0)/dur);pos=a+(b-a)*(1-Math.pow(1-k,3));put(pos);if(k<1)raf=requestAnimationFrame(an)};raf=requestAnimationFrame(an);
    cur=n;info.innerHTML=`<div class="eyebrow">Station ${n+1} von ${st.length} · Dauer: ${st[n][1]}</div><h3 style="font-size:1.2rem;margin:4px 0">${st[n][0]}</h3>${st[n][2]}`;
    $$('button',steps).forEach((b,i)=>b.setAttribute('aria-current',i===n));bN.textContent=n<st.length-1?'Weiter →':'Neuer Bissen'};
  st.forEach((x,i)=>steps.append(h('button',{onclick:()=>go(i),'aria-label':x[0]},i+1)));
  const bN=h('button',{class:'btn pri',onclick:()=>{if(cur<st.length-1)go(cur+1);else{pos=0;put(0);go(0)}}},'Weiter →');
  s.append(h('div',{class:'simgrid'},stage,h('div',{class:'ctrl'},steps,info,h('div',{class:'row'},bN),h('p',{style:'font-size:.85rem;color:var(--muted);margin:0'},'Gesamtdauer: etwa 1 bis 3 Tage – je nach Essen.'))));
  put(0);go(0);return()=>cancelAnimationFrame(raf);
},

      <text x="${cx}" y="${cy-4}" text-anchor="middle" style="font:800 30px var(--f-display);fill:var(--ink)">${day}</text><text x="${cx}" y="${cy+18}" text-anchor="middle" class="t-small">Tag</text>`;

/* ===== Rätsel: Kreuzworträtsel und Wortsuchrätsel ===== */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const shuffleR=(arr,r)=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const cleanWord=w=>w.toUpperCase().replace(/ß/g,'SS').replace(/[^A-ZÄÖÜ]/g,'');
function customWords(){return(store.get('eigeneWoerter')||'').split('\n').map(l=>{const m=l.split(/\s*[–\-:|]\s*/);const w=cleanWord(m[0]||'');return w.length>=2?[w,(m.slice(1).join(' – ')||'').trim()||'(kein Hinweis)']:null}).filter(Boolean)}
function wordSource(src){if(src==='eigene')return customWords();if(src==='alle'){const seen=new Set();return TOPICS.flatMap(t=>t.words||[]).filter(w=>!seen.has(w[0])&&seen.add(w[0]))}const t=TOPICS.find(t=>t.id===src);return t&&t.words?t.words:[]}
const SOURCES=()=>[['alle','Alle Themen der 1. Klasse'],...TOPICS.filter(t=>t.words).map(t=>[t.id,t.title]),['eigene','Eigene Wörter …']];

function puzzleShell(main,{tool,title,lead,src,seed,opt,optLabel,optList,onRegen,qrOk}){
  put(main,h('header',{class:'t-head'},h('div',{class:'eyebrow'},'Rätsel'),h('h1',{},title),h('p',{class:'lp'},lead)));
  const selSrc=h('select',{id:tool+'-src','aria-label':'Wortliste'},SOURCES().map(([v,n])=>h('option',{value:v,selected:v===src},n)));
  const selOpt=h('select',{id:tool+'-opt','aria-label':optLabel},optList.map(([v,n])=>h('option',{value:v,selected:String(v)===String(opt)},n)));
  const go=(s,o,sd)=>{location.hash=`${tool}-${s}-${sd}-${o}`};
  selSrc.onchange=()=>go(selSrc.value,selOpt.value,seed);selOpt.onchange=()=>go(selSrc.value,selOpt.value,seed);
  const ctl=h('div',{class:'pz-ctl'},h('label',{},'Wortliste',selSrc),h('label',{},optLabel,selOpt));
  put(main,ctl);
  if(src==='eigene'){const ta=h('textarea',{id:'eigene-woerter',rows:6,placeholder:'Ein Wort pro Zeile, Hinweis mit Bindestrich:\nNARBE – klebrige Spitze des Stempels\nPOLLEN – gelber Blütenstaub'},store.get('eigeneWoerter')||'');
    put(main,h('div',{class:'pz-own'},h('label',{for:'eigene-woerter'},h('b',{},'Eigene Wörter'),' (mindestens 5)'),ta,h('button',{class:'btn pri',onclick:()=>{store.set('eigeneWoerter',ta.value);go('eigene',selOpt.value,Math.floor(Math.random()*9999)+1)}},'Rätsel erstellen')))}
  const tb=h('div',{class:'toolbar',style:'margin-top:12px'});put(main,tb);
  tb.append(h('button',{class:'btn',html:IC.reset+'Neues Rätsel',onclick:()=>go(src,opt,Math.floor(Math.random()*9999)+1)}));
  tb.append(h('button',{class:'btn',html:IC.qr+'QR-Code',disabled:!qrOk,title:qrOk?'':'Für eigene Wörter gibt es keinen QR-Code – bitte drucken.',onclick:()=>qrURL(`${tool}-${src}-${seed}-${opt}`,'Alle Kinder bekommen genau dieses Rätsel.')}));
  if(!isFramed)tb.append(h('button',{class:'btn',html:IC.print+'Drucken / PDF',onclick:()=>window.print()}));

/* ---------- Kreuzworträtsel ---------- */
function genCross(words,r){
  let best=null;
  for(let a=0;a<40;a++){
    const order=shuffleR(words,r).sort((x,y)=>y.w.length-x.w.length+(a?(r()-.5)*6:0));
    const G=new Map(),placed=[];const key=(x,y)=>x+','+y;const get=(x,y)=>G.get(key(x,y));
    const fits=(w,x,y,dx,dy)=>{if(get(x-dx,y-dy)||get(x+dx*w.length,y+dy*w.length))return -1;let inter=0;
      for(let i=0;i<w.length;i++){const cx=x+dx*i,cy=y+dy*i,g=get(cx,cy);
        if(g){if(g.ch!==w[i]||(dx?g.h:g.v))return -1;inter++}else if(get(cx+dy,cy+dx)||get(cx-dy,cy-dx))return -1}return inter};
    const put=(o,x,y,dx,dy)=>{for(let i=0;i<o.w.length;i++){const k=key(x+dx*i,y+dy*i);const g=G.get(k)||{ch:o.w[i]};if(dx)g.h=true;else g.v=true;G.set(k,g)}placed.push({...o,x,y,dx,dy})};
    put(order[0],0,0,1,0);
    for(const o of order.slice(1)){let cands=[];
      for(const p of placed)for(let i=0;i<p.w.length;i++){const px=p.x+p.dx*i,py=p.y+p.dy*i;
        for(let j=0;j<o.w.length;j++){if(o.w[j]!==p.w[i])continue;const dx=p.dx?0:1,dy=p.dx?1:0;const sx=px-dx*j,sy=py-dy*j;const f=fits(o.w,sx,sy,dx,dy);if(f>0)cands.push([f+r()*.5,sx,sy,dx,dy])}}
      if(cands.length){cands.sort((a,b)=>b[0]-a[0]);const c=cands[0];put(o,c[1],c[2],c[3],c[4])}}
    const xs=[...G.keys()].map(k=>+k.split(',')[0]),ys=[...G.keys()].map(k=>+k.split(',')[1]);
    const W=Math.max(...xs)-Math.min(...xs)+1,H=Math.max(...ys)-Math.min(...ys)+1;
    const score=placed.length*1000-W*H-Math.abs(W-H)*8;
    if(!best||score>best.score)best={score,placed,G,minx:Math.min(...xs),miny:Math.min(...ys),W,H};
  }
  const b=best;b.placed.forEach(p=>{p.x-=b.minx;p.y-=b.miny});
  const starts=[...new Set(b.placed.map(p=>p.y*1000+p.x))].sort((a,c)=>a-c);
  b.placed.forEach(p=>p.no=starts.indexOf(p.y*1000+p.x)+1);
  return b;
}

/* ---------- Wortsuchrätsel ---------- */
function genSearch(words,r,level){
  const longest=Math.max(...words.map(w=>w.w.length));
  const size=Math.max({1:10,2:12,3:14}[level]||12,longest+1);
  let dirs=[[1,0],[0,1]];if(level>=2)dirs.push([1,1],[1,-1]);if(level>=3)dirs=dirs.concat(dirs.map(([a,b])=>[-a,-b]));
  const G=Array.from({length:size},()=>Array(size).fill(null));const placed=[];
  for(const o of [...words].sort((a,b)=>b.w.length-a.w.length)){
    for(let t=0;t<400;t++){const[dx,dy]=dirs[Math.floor(r()*dirs.length)];const x=Math.floor(r()*size),y=Math.floor(r()*size);
      const ex=x+dx*(o.w.length-1),ey=y+dy*(o.w.length-1);if(ex<0||ey<0||ex>=size||ey>=size)continue;
      let ok=true;for(let i=0;i<o.w.length;i++){const g=G[y+dy*i][x+dx*i];if(g&&g!==o.w[i]){ok=false;break}}if(!ok)continue;
      const cells=[];for(let i=0;i<o.w.length;i++){G[y+dy*i][x+dx*i]=o.w[i];cells.push([x+dx*i,y+dy*i])}placed.push({...o,cells});break}}
  const pool=words.map(w=>w.w).join('')+'ABCDEFGHIJKLMNOPRSTUVWZ';
  for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!G[y][x])G[y][x]=pool[Math.floor(r()*pool.length)];
  return{G,size,placed};
}

  document.title='Biologie-Werkstatt';
  const kinds=[['sheet','Arbeitsblätter','je Thema 3 Blätter: Grundlagen, Üben, Forschen'],['sim','Simulationen','ausprobieren, beobachten, vermuten'],['puzzle','Rätsel','Kreuzworträtsel und Wortsuche'],['live','Klassenspiele','Live-Quiz und Millionenshow'],['img','Bilderbibliothek',`${CLIPS.length} Bilder zum Verzieren`],['quiz','Quiz','8 Fragen mit Erklärungen']];
  main.append(h('section',{class:'hero'},h('div',{},h('div',{class:'eyebrow'},'Lehrplan Biologie und Umweltbildung 2023'),h('h1',{html:'Biologie zum <em>Ausprobieren</em>.'}),
    h('p',{},'Für jedes Thema des Mittelschul-Lehrplans: bearbeitbare Arbeitsblätter mit Grafiken, Simulationen, Rätsel und Spiele. Per QR-Code direkt aufs iPad der Kinder.')),
    h('div',{class:'kinds'},kinds.map(([ic,n,d])=>h('div',{class:'kind'},h('b',{html:IC[ic]+n}),h('small',{},d))))));
  const tl=h('div',{class:'toolrow'});TOOLS.forEach(([g,items])=>items.forEach(([id,n,ic])=>tl.append(h('button',{class:'btn',html:IC[ic]+n,onclick:()=>go(id)}))));main.append(tl);
  const ov=h('div',{class:'overview'});
  KLASSEN.forEach(K=>{const ts=TOPICS.filter(t=>t.k===K.k);const done=ts.filter(t=>t.sheet).length;
    ov.append(h('div',{class:'kcard'},h('h2',{},`${K.k}. Klasse`,h('small',{},done?`${done} von ${ts.length} fertig`:'geplant')),
      h('ul',{},ts.map(t=>h('li',{},h('button',{onclick:()=>go(t.id)},h('i',{class:'dot'+(t.sheet?'':' plan')}),t.title))))))});
  main.append(ov);
  main.append(h('p',{style:'color:var(--muted);font-size:.85rem;max-width:80ch;margin-top:28px'},'Kompetenzbereiche: W – Wissen aneignen und kommunizieren · E – Erkenntnisse gewinnen · S – Standpunkte begründen und reflektiert handeln. Alle Texte und Grafiken sind eigens erstellt; Lehrplan-Wortlaut nach BGBl. II Nr. 1/2023.'));
}

function qrURL(path,note){
  const url=baseURL()+'#'+path;
  const box=h('div',{},h('h2',{style:'font-size:1.2rem'},'QR-Code für die iPads'),h('div',{id:'qr'}),h('code',{},url),
    h('p',{style:'font-size:.82rem;color:var(--muted)'},(note||'')+' Funktioniert in der GitHub-Version.'),
    h('button',{class:'btn pri',onclick:()=>m.remove()},'Schließen'));
  const m=h('div',{class:'modal',onclick:e=>{if(e.target===m)m.remove()}},box);document.body.append(m);
  try{new QRCode($('#qr',box),{text:url,width:220,height:220,colorDark:'#000000',colorLight:'#ffffff'})}catch(e){$('#qr',box).textContent='QR-Code konnte nicht erstellt werden.'}
}

const init=()=>{
  buildSide();
  $('#menu').onclick=()=>document.querySelector('.app').classList.toggle('nav-open');
  window.addEventListener('hashchange',route);route();
};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('.modal')?.remove();document.querySelector('.app').classList.remove('nav-open')}});
</script>
</body>
